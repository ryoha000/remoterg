version: "3"

dotenv:
  - "client/apps/web/.env.local"
  - "desktop/services/.env.local"

tasks:
  hostd:
    dir: "desktop/services"
    cmds:
      - cargo run --bin hostd
  hostd:remote:
    dir: "desktop/services"
    cmds:
      - cargo run --bin hostd -- --cloudflare-url "wss://remoterg.the7uya.workers.dev/api/signal" --session-id "fixed"
  hostd:mock:
    dir: "desktop/services"
    cmds:
      - cargo run --bin hostd -- --mock
  hostd:latency-report:
    dir: "desktop/services"
    cmds:
      - cargo run --bin hostd -- --latency-report --latency-report-dir .
  web:
    dir: "client/apps/web"
    cmds:
      - pnpm run dev
    env:
      NODE_OPTIONS: "--import ./instrument.server.mjs"
  e2e:
    dir: "client/apps/web"
    cmds:
      - pnpm exec tsx scripts/e2e-test.ts
  android:check:
    dir: "android"
    cmds:
      - PowerShell -Command ".\gradlew.bat assembleDebug 2>&1 | Select-Object -Last 10"
  android:sync-webrtc-headers:
    dir: "."
    cmds:
      - python android/scripts/sync_webrtc_headers.py
  android:verify-webrtc-headers:
    dir: "."
    cmds:
      - python android/scripts/sync_webrtc_headers.py --verify

  fmt:hostd:
    dir: "desktop/services"
    cmds:
      - cargo fmt

  signaling:
    dir: "signaling"
    cmds:
      - pnpm run dev
